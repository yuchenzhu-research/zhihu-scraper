[project]
name = "zhihu-scraper"
version = "4.0.0"
description = "本地优先、可测试的知乎内容归档工具"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "yuchenzhu-research", email = "zyc20070222@gmail.com" }
]
keywords = ["zhihu", "scraper", "crawler"]

dependencies = [
    "curl_cffi>=0.16.3,<0.17",
    "beautifulsoup4>=4.12.3",
    "latex2mathml>=3.81.0,<4",
    "playwright>=1.62.0,<2",
    "pypdf>=6.17.0,<7",
]

[project.scripts]
zhihu = "zhihu_scraper.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
verbosity_subtests = 0

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.setuptools.packages.find]
include = ["zhihu_scraper*"]
