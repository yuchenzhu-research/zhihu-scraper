name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install locked project and development dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Compile package
        run: uv run --no-sync python -m compileall -q zhihu_scraper

      - name: Check lock file
        run: uv lock --check

      - name: Lint
        run: uv run --no-sync python -m ruff check zhihu_scraper tests

      - name: Check formatting
        run: uv run --no-sync python -m ruff format --check zhihu_scraper tests

      - name: Type check
        run: uv run --no-sync python -m mypy zhihu_scraper

      - name: Run tests
        run: uv run --no-sync python -m pytest
        env:
          PYTHONWARNINGS: error::ResourceWarning

      - name: Check command-line entry point
        run: |
          uv run --no-sync zhihu --version
          uv run --no-sync zhihu --help
          uv run --no-sync zhihu fetch --help
          uv run --no-sync zhihu check --help
          uv run --no-sync zhihu init --help

  browser-smoke:
    name: Managed Chromium smoke / Ubuntu / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install allowed dependency versions
        run: python -m pip install -e ".[dev]"

      - name: Test allowed dependency versions
        run: python -m pytest
        env:
          PYTHONWARNINGS: error::ResourceWarning

      - name: Install managed Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Launch managed Chromium
        run: >-
          python -c "from playwright.sync_api import sync_playwright;
          p=sync_playwright().start(); b=p.chromium.launch(headless=True);
          page=b.new_page(); page.set_content('<title>ready</title><p>browser smoke</p>');
          assert page.title() == 'ready'; b.close(); p.stop()"
